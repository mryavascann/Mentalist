<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cold Read</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('cold-read:tema') || localStorage.getItem('the-mentalist:tema');
          if (t !== 'acik' && t !== 'karanlik') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'karanlik' : 'acik';
          }
          document.documentElement.setAttribute('data-tema', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="kok"></div>
    <script type="module" src="/src/arayuz/main.tsx"></script>
  </body>
</html>
